# Hot-reloaded at runtime (checked every reload_interval_seconds).
# Secrets (proxy creds, cookies) are NOT here - see accounts.yaml / .env.

store_endpoint: "http://127.0.0.1:9000/store_items"
domain: "threads.net"

# How often ConfigStore checks this file's mtime for changes.
reload_interval_seconds: 5

# Overall rate of items leaving the process towards store_items,
# shared across ALL accounts via a single TokenBucket.
target_rate_per_second: 2.0
token_wait_timeout_seconds: 10

# How often EACH account worker runs a scrape cycle.
poll_interval_seconds: 60
poll_jitter_ratio: 0.25

# Drop items older than this before dedup/send.
max_age_seconds: 86400

# Batch POST sizing to /store_items (keep below server BATCH_MAX_ITEMS).
batch_max_items: 200

# How many times to scroll a profile feed per cycle, to trigger the page's
# own pagination GraphQL calls (we intercept, not send them ourselves).
max_feed_scrolls: 3
# Pause between scrolls / after opening a post, so the page's own JS has
# time to fire its GraphQL request and we can capture the response.
scroll_pause_seconds: 1.5
# Whether to also open each post that reports replies and collect its
# DIRECT replies (one extra page navigation per such post - slower).
fetch_replies: true

# In-memory dedup cache size (shared across accounts).
seen_cache_size: 5000

# Backoff on send/browser errors.
base_backoff_seconds: 2.0
max_backoff_seconds: 120.0

# Targets to scrape: Threads profile usernames (without @).
# Large, frequently-posting public profiles. Handles are NOT verified from
# here - a wrong/private/renamed one just logs "no posts found" and is skipped.
# Remove dead ones after the first cycles; add more to raise throughput.
targets:
  - {type: "profile", value: "zuck"}
  - {type: "profile", value: "mosseri"}
  - {type: "profile", value: "instagram"}
  - {type: "profile", value: "nba"}
  - {type: "profile", value: "espn"}
  - {type: "profile", value: "cnn"}
  - {type: "profile", value: "nytimes"}
  - {type: "profile", value: "mrbeast"}
  - {type: "profile", value: "kyliejenner"}
  - {type: "profile", value: "selenagomez"}
  - {type: "profile", value: "nasa"}
  - {type: "profile", value: "netflix"}
