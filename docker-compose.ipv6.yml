# IPv6 mode: the parser leaves from random addresses of your own /64 (no proxies, no Tor).
# Needs the host network so it can bind the addresses; the collector is then reached through the
# host (the reverse tunnel listens on the host):
#   docker compose -f docker-compose.yml -f docker-compose.ipv6.yml up -d --build parser
# .env: IPV6_PREFIX=2a01:ecc0:6000:1b6  (optional: IPV6_STORE_ENDPOINT, default http://127.0.0.1:9000/store_items;
# the normal STORE_ENDPOINT of the bridge mode is left untouched, so switching back is just dropping the -f).
services:
  parser:
    network_mode: host
    extra_hosts: !reset []
    environment:
      IPV6_PREFIX: ${IPV6_PREFIX:?set IPV6_PREFIX in .env}
      STORE_ENDPOINT: ${IPV6_STORE_ENDPOINT:-http://127.0.0.1:9000/store_items}
