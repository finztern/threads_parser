# Account slots. Read ONCE at process start (unlike config.yaml).
# Each account goes through its OWN xray_account_N container (docker-compose.yml),
# which tunnels via its own VLESS server. The vless:// URIs live only in .env
# (VLESS_URI_ACCOUNT_N), never here.
#
# Auth: storage_state/<name>.json (from the login container) is used if present,
# otherwise cookie_file (Cookie Editor JSON). Optional per-account override:
#   storage_state_file: "storage_state/custom.json"

accounts:
  - name: "account_1"
    enabled: false
    cookie_file: "cookies/account_1.json"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
    proxy:
      server: "socks5://xray_account_1:1080"

  - name: "account_2"
    enabled: false
    cookie_file: "cookies/account_2.json"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
    proxy:
      server: "socks5://xray_account_2:1080"
