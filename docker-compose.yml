# Parser: no browser, no accounts. Proxies come from proxies.txt, or from the `tor` service (profile
# `tor`: set TOR_INSTANCES=20 and COMPOSE_PROFILES=tor in .env). url-check can go through the VPN
# nodes in vpn/nodes.txt (Xray runs inside the parser container).
#   cp proxies.txt.example proxies.txt   # your proxies, one per line
#   python3 scripts/test_proxies.py --url "https://your-host/health"
#   docker compose up -d --build parser
# The store_items collector stays on the host, reached via host.docker.internal.

services:
  parser:
    build: .
    env_file: .env
    environment:
      STORE_ENDPOINT: ${STORE_ENDPOINT:-http://host.docker.internal:9000/store_items}
      TOR_HOST: ${TOR_HOST:-host.docker.internal}
      PARSER_SHARD: ${PARSER_SHARD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./proxies.txt:/app/proxies.txt:ro
      - ./proxy-results:/proxy-results:ro
      - ./vpn:/app/vpn:ro
      - ./targets.txt:/app/targets.txt:ro
      - ./config.yaml:/app/config.yaml
      - ./debug:/app/debug
      - ./data:/app/data
    # Keep the host usable for other jobs: hard CPU cap plus low priority under contention.
    cpus: ${PARSER_CPUS:-2.0}
    cpu_shares: 256
    # Hundreds of parallel proxy connections need many file descriptors.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Rotate container logs: at most 3 x 20 MB on disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # Many Tor clients; the parser takes a fresh circuit for every request (scraper/tor_pool.py).
  # Not started by default: enable with COMPOSE_PROFILES=tor (and TOR_INSTANCES>0) in .env.
  tor:
    profiles: ["tor"]
    build: ./tor
    # Host network: Tor reaches relays exactly like a Tor installed on the host (a bridged container
    # often cannot, e.g. "No route to host"). The SOCKS ports bind on the host; only docker/local
    # addresses are allowed by SocksPolicy. Stop a host Tor that uses the same ports first.
    network_mode: host
    environment:
      TOR_INSTANCES: ${TOR_INSTANCES:-20}
      TOR_BASE_PORT: ${TOR_BASE_PORT:-9050}
      TOR_EXIT_NODES: ${TOR_EXIT_NODES:-}
      TOR_ALLOW: ${TOR_ALLOW:-}
    volumes:
      - ./data/tor:/var/lib/tor
    cpus: ${TOR_CPUS:-2.0}
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: unless-stopped
