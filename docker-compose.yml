# ONE container, no browser, no accounts, no VPN.
#   cp proxies.txt.example proxies.txt   # your proxies, one per line
#   python3 scripts/test_proxies.py --url "https://your-host/health"
#   docker compose up -d --build parser
# The store_items collector stays on the host, reached via host.docker.internal.

services:
  parser:
    build: .
    env_file: .env
    environment:
      STORE_ENDPOINT: ${STORE_ENDPOINT:-http://host.docker.internal:9000/store_items}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./proxies.txt:/app/proxies.txt:ro
      - ./proxy-results:/proxy-results:ro
      - ./targets.txt:/app/targets.txt:ro
      - ./config.yaml:/app/config.yaml
      - ./debug:/app/debug
      - ./data:/app/data
    # Keep the host usable for other jobs: hard CPU cap plus low priority under contention.
    cpus: ${PARSER_CPUS:-2.0}
    cpu_shares: 256
    # Hundreds of parallel proxy connections need many file descriptors.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Rotate container logs: at most 3 x 20 MB on disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
