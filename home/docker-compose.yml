# Home bridge: vless (inside the container only) + ssh reverse tunnels to the VPS parsers -> your local collector.
# Run from this directory:  docker compose up -d --build   (see "Домашний мост" in the README)
services:
  bridge:
    build:
      context: ..
      dockerfile: home/Dockerfile
    # Host network: 127.0.0.1:9000 inside the container IS the collector on the home machine.
    network_mode: host
    env_file: .env
    volumes:
      - ./vless.txt:/data/vless.txt:ro
      - ./keys:/keys:ro
      - ./state:/state
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: unless-stopped

  # Optional: one more vless link as a plain local SOCKS5 proxy (127.0.0.1:10809), e.g. for the Exorde url-check of the Reddit test.
  # The link lives in home/vless_urlcheck.txt (not in git). Start it with:  docker compose up -d --build urlcheck-socks
  urlcheck-socks:
    build:
      context: ..
      dockerfile: home/Dockerfile
    command: ["python3", "socks_only.py"]
    network_mode: host
    environment:
      SOCKS_PORT: "10809"
      SOCKS_VLESS_FILE: /data/vless.txt
    volumes:
      - ./vless_urlcheck.txt:/data/vless.txt:ro
    cpus: 0.3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped
