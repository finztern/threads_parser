# Home bridge: a proxy from your subscription (sing-box inside the container only, fastest node chosen automatically)
# + ssh reverse tunnels to the VPS parsers -> your local collector. No ports are published; the proxy listens on a
# loopback port chosen by the OS, so it cannot clash with anything on the host.
# Run from this directory:  docker compose up -d --build   (see "Домашний мост" in the README)
services:
  bridge:
    build:
      context: ..
      dockerfile: home/Dockerfile
    # Host network: 127.0.0.1:9000 inside the container IS the collector on the home machine.
    network_mode: host
    env_file: .env
    volumes:
      - ./vless.txt:/data/vless.txt:ro
      - ./keys:/keys:ro
      - ./state:/state
    cpus: 1.0  # the node tests (a few minutes at start, then every BRIDGE_RESELECT_MINUTES) need some CPU
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    restart: unless-stopped
